name: Maven tests

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests with custom JVM flags
        env:
          MAVEN_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC -XX:+PrintGCDetails -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          echo "Starting Maven tests with the following JVM flags:"
          echo "-Xmx512m: Sets maximum heap size to 512 MB"
          echo "-Xms256m: Sets initial heap size to 256 MB"
          echo "-XX:+UseG1GC: Uses the G1 Garbage Collector for optimized memory management"
          echo "-XX:+PrintGCDetails: Prints detailed garbage collection logs to the console"
          echo "-XX:+HeapDumpOnOutOfMemoryError: Creates a heap dump if an OutOfMemoryError occurs"
          
          mvn verify

      - name: Get JaCoCo Coverage
        id: coverage  
        run: |
          coverage=$(python3 config/coverage.py target/site/jacoco/jacoco.csv) 
          echo "COVERAGE=$coverage" >> $GITHUB_ENV

      - name: Fail if coverage has not improved.
        run: |
          coverage=$COVERAGE
          threshold=81.58
          if (( $(echo "$coverage - $threshold <= 0.1" | bc -l) )); then
            echo "Coverage has not improved."
            exit 1
          else
            echo "New coverage: $coverage%"
          fi
