name: Maven tests with individual JVM flags

on:
  pull_request:
  push:

jobs:
  build-with-flags:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flag:
          - "-Xmx256m" # Visiblement, limiter la mémoire maximale à 256m rend la compilation un peu plus longue, mais toujours possible
          - "-XX:+PrintTenuringDistribution" # Affiche la distribution des objets vivants (instanciés) dans le tas
          - "-XX:+AggressiveOpts" # Active des options d'optimisation agressives, expérimentales
          - "-enableassertions" # Active les assertions (elles sont rendues plus strictes)
          - "-XX:+UseStringDeduplication" # Active la déduplication des chaînes de caractèresg
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests with JVM flag ${flag}
        env:
          MAVEN_OPTS: "${{ matrix.flag }}"
        run: |
          echo "Starting Maven tests with JVM flag: ${{ matrix.flag }}"
          
          mvn verify

      - name: Get JaCoCo Coverage
        id: coverage  
        run: |
          coverage=$(python3 config/coverage.py target/site/jacoco/jacoco.csv) 
          echo "COVERAGE=$coverage" >> $GITHUB_ENV
          echo "Coverage measured with JVM flag ${{ matrix.flag }}: $coverage"
